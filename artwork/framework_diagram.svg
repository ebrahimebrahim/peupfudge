<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:svg="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
  width="93.919556mm"
  height="31.829287mm"
  viewBox="0 0 940 320"
  version="1.1"
  id="framework-diagram"
  inkscape:version="1.2"
  sodipodi:docname="framework_diagram.svg">
  <sodipodi:namedview
    id="namedview1"
    pagecolor="#ffffff"
    bordercolor="#666666"
    inkscape:document-units="mm"
    showgrid="false" />
  <defs id="defs1">
    <marker
      id="arrowhead"
      markerWidth="8"
      markerHeight="8"
      refX="7"
      refY="4"
      orient="auto"
      markerUnits="strokeWidth">
      <path d="M 0,0 L 8,4 L 0,8 Z" fill="#000000" />
    </marker>
    <style>
      .label {
        font-family: "Libertinus Serif", serif;
        font-style: normal;
        font-weight: 400;
        fill: #000000;
      }
      .outline {
        fill: none;
        stroke: #000000;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .arrow {
        fill: none;
        stroke: #000000;
        stroke-width: 2;
        marker-end: url(#arrowhead);
      }
    </style>
  </defs>

  <g inkscape:groupmode="layer" inkscape:label="Labels" id="labels">
    <text class="label" x="6" y="39" font-size="42">Framework</text>
    <text class="label" x="373" y="39" font-size="42">World</text>
    <text class="label" x="681" y="39" font-size="42">Campaign</text>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="Framework" id="framework">
    <path
      class="outline"
      d="M 1,70 H 250 V 210 H 225
         C 215,210 212,205 217,199
         C 222,192 213,187 201,187
         C 189,187 180,192 185,199
         C 190,205 187,210 177,210
         H 148
         C 138,210 135,205 140,199
         C 145,192 136,187 124,187
         C 112,187 103,192 108,199
         C 113,205 110,210 100,210
         H 72
         C 62,210 59,205 64,199
         C 69,192 60,187 48,187
         C 36,187 27,192 32,199
         C 37,205 34,210 24,210
         H 1 Z" />
    <path class="outline" d="M 1,210 V 255 H 250 V 210" />
    <path class="outline" d="M 84,210 V 255 M 167,210 V 255" />
    <text class="label" x="125" y="128" font-size="38" text-anchor="middle">Peupfudge</text>
    <text class="label" x="125" y="160" font-size="25" text-anchor="middle">(this document)</text>
    <text class="label" x="125" y="293" font-size="27" text-anchor="middle">(modules)</text>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="Worlds" id="worlds">
    <rect class="outline" x="325" y="69" width="225" height="91" rx="8" />
    <text class="label" x="437.5" y="107" font-size="33" text-anchor="middle">
      <tspan x="437.5" y="107">Middle</tspan>
      <tspan x="437.5" y="143">Earth</tspan>
    </text>
    <rect class="outline" x="325" y="178" width="225" height="91" rx="8" />
    <text class="label" x="437.5" y="216" font-size="32" text-anchor="middle">
      <tspan x="437.5" y="216">The Galactic</tspan>
      <tspan x="437.5" y="252">Empire</tspan>
    </text>
    <circle cx="437.5" cy="287" r="3.2" />
    <circle cx="437.5" cy="299" r="3.2" />
    <circle cx="437.5" cy="311" r="3.2" />
  </g>

  <g inkscape:groupmode="layer" inkscape:label="Campaigns" id="campaigns">
