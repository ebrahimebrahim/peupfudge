    <path class="arrow" d="M 250,160 L 317,222" />
    <path class="arrow" d="M 550,114 L 614,86" />
    <path class="arrow" d="M 550,114 L 614,140" />
    <path class="arrow" d="M 550,223 L 614,195" />
    <path class="arrow" d="M 550,223 L 614,249" />
